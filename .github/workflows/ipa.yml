name: Build Rewise.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Build the unsigned app
        run: |
          xcodebuild -project Rewise.xcodeproj -scheme Rewise -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER=com.martincsattos.rewise \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -10 | sed 's/^/::error::/'

      - name: Make Rewise.ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Rewise.app Payload/
          zip -qry Rewise.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Rewise-ipa
          path: Rewise.ipa

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-$GITHUB_RUN_NUMBER" Rewise.ipa --target "$GITHUB_SHA"
          --title "Rewise build $GITHUB_RUN_NUMBER" --notes "Unsigned .ipa for Sideloadly."
